<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TryMe · 本地真实录制实验</title><link rel="stylesheet" href="review.css"><style>main{max-width:1000px;margin:30px auto;padding:24px}iframe{width:100%;height:650px;border:1px solid #ccc;border-radius:20px;background:white}.tools{position:sticky;top:0;background:#f7f6f2;padding:14px;z-index:5}#status{min-height:45px}video{width:100%;max-height:500px}</style><main><a href="index.html#/video">← 回视频方案</a><h1>真实作品 · 8 秒录制实验</h1><p>只录制下方本地 Orbit 的 Canvas，不采集桌面、麦克风或账号。先点游戏中的「开始游戏」，再点录制，然后操作游戏。完成后保存到本地原型的 assets/orbit-preview.webm。</p><div class="tools"><button class="button primary" id="record">录制 8 秒</button><p id="status" role="status">未录制。请先启动下方游戏。</p></div><iframe src="/examples/orbit.html" title="本地 Orbit 游戏"></iframe><video controls hidden></video></main><script type="module">
const button=document.querySelector('#record'),status=document.querySelector('#status'),preview=document.querySelector('video');let objectURL;
button.onclick=()=>{const canvas=document.querySelector('iframe').contentDocument.querySelector('canvas');if(!canvas){status.textContent='先点击下方游戏的「开始游戏」。';return;}if(!canvas.captureStream||!window.MediaRecorder){status.textContent='当前浏览器不支持本地 Canvas 录制。';return;}const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));if(!mime){status.textContent='没有可用的 WebM 编码器。';return;}button.disabled=true;const stream=canvas.captureStream(24),recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1500000}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'video/webm'});if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(blob);preview.src=objectURL;preview.hidden=false;try{const r=await fetch('/__record',{method:'POST',headers:{'Content-Type':'video/webm'},body:blob});if(!r.ok)throw Error('本地保存失败 '+r.status);status.textContent=`已录制并保存 · ${(blob.size/1024).toFixed(0)} KB · 8 秒 · 无模型费用。`;}catch(error){status.textContent=error.message;}button.disabled=false;};recorder.start();status.textContent='正在录制 8 秒：现在可以操作下方游戏。';setTimeout(()=>recorder.stop(),8000);};
</script></html>
