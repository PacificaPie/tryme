<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f8f6">
  <meta name="description" content="发现小游戏，发布你的作品，整理一张创作者名片。">
  <title>TryMe · 发现游戏</title>
  <link rel="icon" href="assets/tryme-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="refinements.css">
</head>
<body>
  <a class="skip-link" href="#view">跳到内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#/discover" aria-label="TryMe 首页"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M5 5h18v5h-6v14h-6V10H5Z" fill="currentColor"/></svg></span>TryMe<span class="prototype-tag">原型</span></a>
      <nav id="nav"></nav>
      <div class="sidebar-bottom" id="account"></div>
    </aside>
    <div class="main-wrap">
      <header class="topbar" id="topbar"></header>
      <main id="view" class="page" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form">
      <div class="dialog-header"><h2 id="auth-title">登录 TryMe</h2><button class="icon-button" type="button" data-action="cancel-auth" aria-label="关闭登录">×</button></div>
      <div class="dialog-body"><p class="muted">使用演示身份，内容保存在此浏览器。</p><div class="form-field"><label for="login-name">名字</label><input id="login-name" name="name" required maxlength="24" autocomplete="nickname" placeholder="你的名字"></div><p class="form-error" id="auth-error" role="alert"></p></div>
      <div class="dialog-actions"><button class="button primary" type="submit">继续</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
