<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>点亮收藏</title>
<script src="/theme-init.js"></script>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#30332b;background:#e9e7de;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,a,input{font:inherit}button{cursor:pointer;color:inherit;background:#f8f7f0;border:1px solid #c6c7b9;border-radius:5px;min-height:38px;padding:8px 13px}button:hover:not(:disabled){background:#fff}button:disabled{opacity:.35;cursor:default}button:focus-visible,a:focus-visible,canvas:focus-visible,summary:focus-visible{outline:3px solid #ad654a;outline-offset:3px}.shell{max-width:1600px;margin:auto}.profile{padding:23px 28px 3px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}h1{font-family:"Songti SC",Georgia,serif;font-size:29px;line-height:1.2;font-weight:600;margin:0}#headline{font-size:12px;color:#717565;margin:8px 0 0}#bio{font-size:12px;color:#717565;line-height:1.65;margin:8px 0 0;max-width:650px;white-space:pre-wrap}#website{font-size:12px;color:#626a52;text-decoration:none;white-space:nowrap;padding:8px 0}.stage{height:500px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:pan-y}.fallback{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px}.fallback h2{font-size:20px;font-weight:500;margin:0 0 10px}.fallback p{font-size:13px;color:#737969;line-height:1.8;max-width:350px;margin:0}.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:0 20px 18px;font-size:11px;color:#6b725f}.pager button{background:transparent;min-width:40px;padding:7px 11px}#hover-title{position:absolute;left:0;top:0;padding:7px 10px;border-radius:4px;background:#30362a;color:#fff;font-size:11px;pointer-events:none;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}.details{margin:0 28px 22px;border-top:1px solid #d2d4c7;padding-top:15px}.details summary{font-size:12px;color:#747b68;cursor:pointer;min-height:27px;list-style:none}.details summary:after{content:'+';margin-left:10px}.details[open] summary:after{content:'−'}.details summary::-webkit-details-marker{display:none}.works{list-style:none;padding:0;margin:13px 0 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.work{display:flex;align-items:center;gap:10px;text-align:left;width:100%;height:65px;padding:7px;background:#f6f6ee;border-color:#d2d4c7}.work img{width:64px;height:43px;object-fit:contain;background:#e5e6dc;border-radius:3px}.work span{min-width:0;flex:1}.work strong{font-size:12px;font-weight:550;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.work small{font-size:10px;color:#79816d;display:block;margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#signature{text-align:right;font-family:"Songti SC",Georgia,serif;font-size:17px;color:#6c735e;line-height:1.65;margin:0 28px 23px;white-space:pre-wrap;overflow-wrap:anywhere}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}@media(max-width:620px){.profile{padding:21px 18px 2px;gap:12px}h1{font-size:26px}.stage{height:490px}.details{margin:0 18px 18px}.works{grid-template-columns:1fr}.pager button{min-height:44px;min-width:44px}#signature{margin:0 18px 20px}.work{min-height:60px}#website{font-size:10px;max-width:110px;white-space:normal;overflow-wrap:anywhere}}
</style><link rel="stylesheet" href="/theme.css"></head><body data-portfolio-embed>
<main id="shell" class="shell"><header class="profile"><div><h1 id="name"></h1><p id="headline" hidden></p><p id="bio" hidden></p></div><a id="website" target="_blank" rel="noopener noreferrer" hidden></a></header><section id="stage" class="stage" data-state="waiting" aria-label="点亮收藏作品桌面"><canvas id="canvas" tabindex="0" aria-label="作品桌面。点击作品可打开；方向键选择作品，回车打开。" hidden></canvas><div id="fallback" class="fallback"><h2 id="fallback-title">正在准备作品</h2><p id="fallback-message"></p></div><div id="hover-title" hidden></div></section><div id="pager" class="pager" hidden><button id="prev" aria-label="上一组作品">←</button><span id="page-label"></span><button id="next" aria-label="下一组作品">→</button></div><details id="details" class="details"><summary>作品列表</summary><ul id="works" class="works"></ul></details><p id="signature" hidden></p><p id="status" class="sr-only" role="status" aria-live="polite"></p></main>
<script type="module" src="/theme.js"></script>
<script src="/gallery/vendor/three.min.js"></script><script src="/gallery/config.js"></script><script src="shaders.js"></script><script src="core.js"></script><script src="assets.js"></script><script src="layout.js"></script><script src="desk.js"></script><script type="module" src="controller.js"></script>
</body></html>
