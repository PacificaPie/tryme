<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>试玩 · Funtrack</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#2e302c;background:#fafaf7;font-synthesis:none;-webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}[hidden]{display:none!important}
    .player{width:min(100%,940px);margin:auto;padding:22px}
    .heading{margin-bottom:17px}h1{margin:0;font-size:18px;font-weight:600;letter-spacing:-.4px}.instructions{margin:6px 0 0;color:#85877e;font-size:12px;line-height:1.7}
    .stage{position:relative;overflow:hidden;aspect-ratio:45/28;border:1px solid #e3e5dc;border-radius:12px;background:#f3f0e9}
    .cover,.host{position:absolute;inset:0;width:100%;height:100%}.cover{object-fit:cover}.host canvas{width:100%!important;height:100%!important;border-radius:0!important}
    .start-layer{position:absolute;inset:0;display:grid;place-items:center;background:#fff3}
    .button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 17px;border:1px solid #dedfd7;border-radius:7px;background:#fff;color:#4a4e43;font-size:12px;line-height:1.4}
    .button:hover{background:#f3f5ef}.button.primary{background:#353b2e;border-color:#353b2e;color:#fff}.button.primary:hover{background:#4b5540}.button.start{min-height:44px;padding:12px 24px;background:#fff;color:#30362b;box-shadow:0 3px 18px #26321a12}
    .button:focus-visible{outline:2px solid #687557;outline-offset:4px}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;min-height:57px;padding-top:12px}.status{margin:0;font-size:12px;line-height:1.6;color:#858b7b}.actions{display:flex;gap:8px;flex-shrink:0}
    .error{margin:20px 0 0;font-size:13px;line-height:1.7;color:#945541}
    @media(max-width:520px){.player{padding:16px 12px}.heading{margin-bottom:13px}h1{font-size:16px}.instructions{font-size:11px}.stage{border-radius:9px}.toolbar{gap:10px}.status{font-size:11px}.button{min-height:40px;padding-inline:12px}.host canvas:focus-visible{outline-offset:-3px!important}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="player" aria-labelledby="game-title">
    <header class="heading">
      <h1 id="game-title">试玩</h1>
      <p id="instructions" class="instructions"></p>
    </header>
    <section id="stage" class="stage" aria-label="游戏画面" hidden>
      <img id="cover" class="cover" alt="" width="900" height="560">
      <div id="game-host" class="host" hidden></div>
      <div id="start-layer" class="start-layer">
        <button id="start" class="button primary start" type="button">开始试玩</button>
      </div>
    </section>
    <div id="toolbar" class="toolbar" hidden>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="end" class="button" type="button" hidden>结束</button>
        <button id="restart" class="button primary" type="button" hidden>再试一次</button>
      </div>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <noscript><p class="error">请启用 JavaScript 后试玩。</p></noscript>
  </main>
  <script type="module" src="controller.js"></script>
</body>
</html>
