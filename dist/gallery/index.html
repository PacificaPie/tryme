<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Funtrack · 卡中展厅</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#262621;background:#eae7df;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:1px solid #aaa69b;background:#f9f7f1;border-radius:5px;padding:8px 13px;color:inherit;line-height:1.3}button:hover:not(:disabled){background:#fff;border-color:#38382f}button:focus-visible,canvas:focus-visible,a:focus-visible{outline:3px solid #b84e36;outline-offset:3px}button:disabled{opacity:.4;cursor:default}button.primary{background:#242520;color:#fff;border-color:#242520}button.primary:hover:not(:disabled){background:#44453a}.shell{max-width:1500px;margin:0 auto}.header{padding:18px 22px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:.14em;color:#706f65;margin:0 0 5px}h1{font-size:17px;letter-spacing:.02em;font-weight:650;line-height:1.35;margin:0}#author-bio{font-size:12px;line-height:1.5;color:#6d6c63;margin:5px 0 0;max-width:680px}.state{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.toolbar{padding:0 22px 11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12px}.spacer{flex:1}.stage{position:relative;height:450px;min-height:270px;overflow:hidden;background:#eae7df}canvas{display:block;width:100%;height:100%;touch-action:pan-y}canvas[hidden]{display:none}.fallback{position:absolute;inset:0;display:grid;place-content:center;gap:12px;padding:25px;text-align:center;color:#626359}.fallback[hidden]{display:none}.fallback strong{font-size:22px;color:#33352c}.fallback p{margin:0;max-width:440px;line-height:1.8;font-size:13px}.stage-note{position:absolute;bottom:9px;left:16px;right:16px;text-align:center;font-size:11px;line-height:1.5;color:#6d6e62;pointer-events:none}.footer{padding:12px 22px 18px;border-top:1px solid #d1cec4;background:#f2efe8}.work-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;font-size:11px;color:#64655a}.work-heading p{margin:0}.paging{display:flex;gap:6px;align-items:center}.paging button{padding:4px 8px;font-size:11px}.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px;list-style:none;margin:0;padding:0}.works li{min-width:0}.work{width:100%;height:57px;display:flex;text-align:left;align-items:center;gap:10px;padding:6px;background:#faf8f3;border-color:#d3d0c5}.work img{width:61px;height:39px;object-fit:cover;border-radius:2px;background:#e7e3d9}.work .copy{min-width:0}.work strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.work small{display:block;margin-top:3px;font-size:10px;color:#74746b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.work .arrow{margin-left:auto;flex-shrink:0;color:#76776a}#page-note{font-size:11px;line-height:1.6;margin:8px 0 0;color:#77786b}#empty{font-size:13px;color:#6d6e62;padding:8px 0}[hidden]{display:none!important}@media(max-width:560px){.header{padding:14px 14px 10px}.toolbar{padding:0 14px 10px}.footer{padding:11px 14px 15px}.stage{height:350px}.works{grid-template-columns:1fr}.state{font-size:10px}.toolbar button{padding:8px 10px}.toolbar button,.paging button,.work{min-height:44px}.rotate-label{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="shell" class="shell" aria-label="卡中展厅互动预览">
  <header class="header"><div><h1 id="gallery-title">卡中展厅</h1><p id="author-bio" hidden></p></div><div id="gallery-status" class="state" role="status" aria-live="polite">等待作品</div></header>
  <nav class="toolbar" aria-label="展厅控制">
    <button id="toggle" class="primary" disabled aria-pressed="false">展开展厅</button>
    <button id="flip" disabled>翻到背面</button>
    <span class="spacer"></span>
    <button id="left" hidden disabled aria-label="向左旋转展厅">←</button><button id="right" hidden disabled aria-label="向右旋转展厅">→</button>
  </nav>
  <section id="stage" class="stage" data-state="waiting" data-face="front" aria-label="三维名片预览">
    <canvas id="gallery-canvas" tabindex="0" aria-label="三维折纸展厅；展开后可拖动旋转，点击作品查看详情，也可使用下方作品按钮" hidden></canvas>
    <div id="fallback" class="fallback"><strong id="fallback-title">正在准备名片</strong><p id="fallback-message">将使用已选作品的标题、简介和封面。</p></div>
  </section>
  <section class="footer" aria-label="展厅中的作品">
    <div class="work-heading"><p id="work-count">尚未选择作品</p><div id="paging" class="paging" hidden><button id="prev" aria-label="上一组作品">←</button><span id="page-label"></span><button id="next" aria-label="下一组作品">→</button></div></div>
    <p id="empty">等待父页面传入已选作品。</p><ul id="works" class="works"></ul><p id="page-note" hidden></p>
  </section>
</main>
<script src="vendor/three.min.js"></script>
<script src="shaders.js"></script>
<script src="core.js"></script>
<script src="paper.js"></script>
<script src="prints.js"></script>
<script src="popup.js"></script>
<script src="controller.js"></script>
</body>
</html>
