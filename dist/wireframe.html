<body>
<header class="review-bar">
 <div class="review-brand"><b>Funtrack / 页面线框稿</b><small>结构讨论 · 数据与登录均为演示</small></div>
 <div class="review-controls"><a class="button" id="overview-link" href="#/map">页面总览</a><a class="button" href="#/costs">成本试算</a><label class="hidden" for="page-select">预览页面</label><select id="page-select" aria-label="预览页面"></select><label class="hidden" for="scenario">演示身份</label><select id="scenario" aria-label="演示身份"><option value="creator">已有作品的创作者</option><option value="new">新创作者</option><option value="guest">未登录访客</option></select></div>

<div id="toast" class="toast hidden" role="status"></div>
<dialog id="login" class="dialog" aria-labelledby="login-title"><h2 id="login-title">登录 Funtrack</h2><p id="login-reason"></p><button class="primary" id="login-continue">以演示账号继续</button><button class="text-button" id="login-cancel">返回，暂不登录</button><p class="small muted" style="margin-top:18px;font-size:11px">原型交互，不创建真实账号。</p></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pages=[['/map','页面总览'],['/discover','发现作品'],['/creators','创作者名片'],['/card/me','公开名片'],['/studio','创作者中心 · 概览'],['/studio/works','创作者中心 · 我的作品'],['/studio/data','创作者中心 · 数据'],['/studio/feedback','创作者中心 · 反馈'],['/studio/card','创作者中心 · 我的名片'],['/publish','发布作品'],['/costs','名片生成 · 成本试算']];
$('#page-select').innerHTML=pages.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
const seededWorks=[{id:'salt',name:'Salt Run',desc:'在一座不断变化的城市里，找到自己的节奏。',kind:'salt',mode:'SDK',version:'v0.3',views:126,starts:52,feedback:6},{id:'orbit',name:'Orbit',desc:'转动轨道，收集散落的星星。',kind:'orbit',mode:'平台托管',version:'v0.2',views:98,starts:42,feedback:4},{id:'garden',name:'纸上花园',desc:'把几何拼成一座小花园。',kind:'garden',mode:'外部链接',version:'v0.1',views:62,starts:null,feedback:2,clicks:28}];
seededWorks.forEach(w=>w.authorId='lin');
const otherWorks=[{id:'echo',name:'Echo Step',desc:'跟着声音寻找下一块落脚点。',kind:'salt',authorId:'aya',version:'v0.1',mode:'SDK',views:0,starts:0,feedback:0},{id:'pond',name:'夜池',desc:'用一圈圈涟漪拼出夜晚。',kind:'orbit',authorId:'aya',version:'v0.2',mode:'SDK',views:0,starts:0,feedback:0},{id:'paper',name:'纸间',desc:'折起纸张，留下一个小世界。',kind:'garden',authorId:'man',version:'v0.1',mode:'外部链接',views:0,starts:null,feedback:0}];
const seedFeedback=[{id:'f1',work:'salt',version:'v0.3',text:'第二次跳跃没有接上。这里如果能提前看到下一个平台，会更愿意再试一次。',author:'木木',time:'今天 14:32',type:'建议',done:false},{id:'f2',work:'orbit',version:'v0.2',text:'旋转和收集的感觉很舒服，希望后面有更难的轨道。',author:'阿屿',time:'昨天 20:16',type:'喜欢',done:false},{id:'f3',work:'garden',version:'v0.1',text:'手机上有两块拼图不太容易选中。',author:'栗子',time:'昨天 11:08',type:'问题',done:false}];
let state,cardDraft,publishDraft,feedbackDraft={},played={},selectedFeedback='f1',pendingLogin=null,loginOrigin='',lastFocus=null,chartMetric='views',toastTimer;
function reset(scenario){state={scenario,authorId:scenario==='new'?'new':'lin',signed:scenario!=='guest',sentFeedback:[],works:scenario==='new'?[]:structuredClone(seededWorks),profile:{name:scenario==='new'?'小林':'林可',bio:'用代码做一些小而有趣的游戏。',selected:scenario==='new'?[]:['salt','orbit','garden'],published:scenario!=='new',template:'fold'},feedback:scenario==='new'?[]:structuredClone(seedFeedback),cardVisits:scenario==='new'?0:63};cardDraft=structuredClone(state.profile);publishDraft={name:'',url:'',desc:''};feedbackDraft={};played={};chartMetric='views';selectedFeedback='f1';generatedCard=null;generationReceipt=null;generationCache.clear();artifactViews.clear();cancelLogin();}
function route(){const u=new URL((location.hash.slice(1)||'/map'),'https://wireframe.local');return {path:u.pathname,q:u.searchParams};}
function go(path){if(location.hash==='#'+path)render();else location.hash=path;}
function art(w){return `<div class="art ${esc(w.kind)}" aria-hidden="true"><div class="shape"></div></div>`;}
function lookup(id){return state.works.find(w=>w.id===id)||seededWorks.find(w=>w.id===id)||otherWorks.find(w=>w.id===id);}
function cardData(id,draft=false){if(id==='me'||id===state.authorId)return draft?cardDraft:state.profile;if(id==='lin')return {name:'林可',bio:'用代码做一些小而有趣的游戏。',selected:['salt','orbit','garden'],published:true};return {name:id==='aya'?'阿屿':'小满',bio:id==='aya'?'交互设计师，做游戏，也做实验。':'把日常的小点子做成可以玩的东西。',selected:id==='aya'?['echo','pond']:['paper'],published:true};}
function selectedWorks(profile){return profile.works||profile.selected.map(id=>lookup(id)).filter(Boolean);}
function notify(msg){$('#toast').textContent=msg;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2800);}
function requireLogin(reason,fn){if(state.signed){fn();return;}pendingLogin=fn;loginOrigin=location.hash;lastFocus=document.activeElement;$('#login-reason').textContent=reason;$('#login').showModal();}
function cancelLogin(){pendingLogin=null;loginOrigin='';if($('#login').open)$('#login').close();}
function shell(content,active,studio=false){return `<section class="product"><header class="app-header"><a class="wordmark" href="#/discover">funtrack.</a><nav class="global-nav" aria-label="主导航">${[['discover','发现作品','/discover'],['creators','创作者名片','/creators'],['studio','创作者中心','/studio']].map(([id,name,url])=>`<a href="#${url}" class="${active===id?'active':''}" ${active===id?'aria-current="page"':''}>${name}</a>`).join('')}</nav><div class="account">${state.signed?`<a href="#/studio/card" aria-label="我的名片"><span class="avatar">${esc(state.profile.name.slice(0,1))}</span></a>`:'<button class="text-button" data-action="login">登录</button>'}</div></header>${studio?`<nav class="subnav" aria-label="创作者中心">${[['/studio','概览'],['/studio/works','我的作品'],['/studio/data','数据'],['/studio/feedback','反馈'],['/studio/card','我的名片']].map(([url,t])=>`<a href="#${url}" class="${route().path===url||url==='/studio/card'&&route().path.includes('/studio/card/')?'active':''}">${t}</a>`).join('')}</nav>`:''}<div class="page">${content}</div></section><div class="footer-review"><span>页面草图 · 可点击导航、按钮与作品</span><span>所有数值为示意 · 状态仅保留到刷新</span></div>${reviewNote()}`;}
function reviewNote(){const p=route().path;const note=p.includes('/data')?'数据口径：作品页访问、开始试玩与反馈分开统计。外链作品没有接入游戏事件时，试玩显示“—”；名片访问单独计算。时间筛选与作品筛选只切换示意数据。':p.includes('/card')||p==='/creators'?'名片直接复用已发布作品：选作品 → 选模板 → 生成，再决定发布。模板合成不调用 AI；已有公开名片在新版本发布前不变。四种排版是原 demo 方向的线框适配，不是原 3D 动画的移植。':p==='/studio'?'概览把作品、数据、反馈和自己的名片同时摆出来。概览只看摘要；点数字、作品或反馈，进入对应详情。':p==='/publish'?'先走作品链接发布。托管上传和 SDK 接入的实现范围留待下一轮确认，不把它们伪装成当前已有能力。':p.includes('/work/')?'这里验证“开始试玩 → 留下反馈”的位置与返回路径。试玩区是占位交互，不加载真实游戏。': '本轮只讨论入口是否清楚、各页面的主任务，以及名片与作品之间的关系。视觉、算法推荐、会员和社区功能都未展开。';return `<details class="review-note"><summary>本页讨论点</summary><p>${note}</p>${p.includes('/card')?'<p>生成记录和模型/云资源假设见评审工具栏的「成本试算」。</p>':''}${['/discover','/studio','/studio/works','/studio/data'].includes(p)?'<p>参考了 Pinterest 的发现、Creator Hub 和单作品统计层级，以及小红书官方学习中心的近 7 日数据与单笔记入口。小红书登录后台未做视觉核验；本稿的具体布局是针对 Funtrack 的设计选择。</p><p class="evidence-links"><a href="https://help.pinterest.com/en/article/discover-ideas-on-pinterest" target="_blank" rel="noopener">Pinterest 发现</a><a href="https://help.pinterest.com/en/business/article/pin-stats" target="_blank" rel="noopener">Pinterest 单作品统计</a><a href="https://school.xiaohongshu.com/lesson/normal/af0fe7e97bb0433fac9da5d1df52b07f?fromPage=LessonList&viewSource=LESSON" target="_blank" rel="noopener">小红书官方课程</a></p>':''}</details>`;}
function miniWork(){return '<div><div class="mini-art">◇</div><div class="mini-line"></div></div>';}
function mapPage(){return `<section class="board"><div class="board-heading"><h1>页面结构</h1><p>三个入口。先看每一块放在哪里，再点进去看动线。</p></div><div class="board-grid"><section class="map-column"><div class="map-label"><span>01</span>发现作品</div><a class="mini-page" href="#/discover"><div class="mini-top">funtrack. / 发现作品</div><div class="mini-body"><h2>可以试玩的作品</h2><div class="mini-grid">${miniWork().repeat(4)}</div></div></a><div class="map-children"><a href="#/work/salt">作品详情 / 试玩<span>↗</span></a><a href="#/work/salt?feedback=1">试玩后的反馈<span>↗</span></a></div></section><section class="map-column"><div class="map-label"><span>02</span>创作者名片</div><a class="mini-page" href="#/creators"><div class="mini-top">funtrack. / 创作者名片</div><div class="mini-body"><h2>从作品认识创作者</h2><div class="mini-grid">${[1,2].map(()=>'<div class="mini-id"><div class="mini-avatar"></div><div class="mini-line"></div><div class="mini-art">▱</div></div>').join('')}</div></div></a><div class="map-children"><a href="#/card/me">公开名片<span>↗</span></a><a href="#/card/me?open=1">卡中展厅 / 作品<span>↗</span></a></div></section><section class="map-column"><div class="map-label"><span>03</span>创作者中心</div><a class="mini-page" href="#/studio"><div class="mini-top">概览 · 作品 · 数据 · 反馈 · 我的名片</div><div class="mini-body"><h2>创作者概览</h2><div class="mini-metrics"><div>作品页访问<b>286</b></div><div>开始试玩<b>94</b></div><div>收到反馈<b>12</b></div></div><div class="mini-chart">${[30,50,65,55,75,100,85].map(n=>`<i style="height:${n}%"></i>`).join('')}</div><div class="mini-card">我的名片　/　预览 · 编辑</div></div></a><div class="map-children"><a href="#/studio/data">完整数据面板<span>↗</span></a><a href="#/studio/feedback">反馈收件箱<span>↗</span></a><a href="#/studio/card">选作品 / 选模板 / 生成<span>↗</span></a><a href="#/publish">发布作品<span>↗</span></a></div></section></div><div class="flow-list"><a href="#/discover"><b>试玩者</b><span>发现作品 → 作品详情 → 试玩 → 反馈 → 回到作品</span></a><a href="#/creators"><b>看名片的人</b><span>创作者名片 → 公开名片 → 展开作品 → 试玩</span></a><a href="#/studio"><b>创作者</b><span>创作者中心 → 发布作品 → 看数据与反馈 → 选作品 → 选模板 → 生成名片</span></a></div></section>`;}
function workTile(w,from='/discover'){return `<a class="game-card" href="#/work/${esc(w.id)}?from=${encodeURIComponent(from)}">${art(w)}<div class="caption"><h3>${esc(w.name)}</h3><span class="muted small">↗</span></div><div class="meta">${esc(w.desc)}</div></a>`;}
function discover(){const q=route().q,query=q.get('q')||'',kind=q.get('kind')||'all';const works=[...state.works,...[...seededWorks,...otherWorks].filter(w=>!state.works.some(x=>x.id===w.id))].filter(w=>(kind==='all'||w.kind===kind)&&(!query||(w.name+' '+w.desc+' '+cardData(w.authorId).name).toLowerCase().includes(query.toLowerCase())));const source='/discover?'+q.toString();return shell(`<div class="page-head"><h1>发现作品</h1><form class="search-form" id="work-search"><input name="q" aria-label="搜索作品或创作者" placeholder="搜索作品或创作者" value="${esc(query)}"><button type="submit" aria-label="搜索">⌕</button></form></div><nav class="feed-tabs" aria-label="作品类型">${[['all','全部'],['salt','动作'],['orbit','轻松'],['garden','解谜']].map(([id,label])=>`<a class="${kind===id?'active':''}" href="#/discover?kind=${id}&q=${encodeURIComponent(query)}">${label}</a>`).join('')}</nav><div class="content-grid">${works.map(w=>`<a class="game-card" href="#/work/${w.id}?from=${encodeURIComponent(source)}">${art(w)}<h3>${esc(w.name)}</h3><div class="meta"><span>${esc(cardData(w.authorId).name)}</span><span>试玩 ↗</span></div></a>`).join('')}</div>${!works.length?'<div class="empty"><h2>没有找到作品</h2><a class="button" href="#/discover">查看全部</a></div>':''}`,'discover');}
function creatorTile(id){const p=cardData(id),ws=selectedWorks(p);return `<a class="creator-tile" href="#/card/${id}"><div class="creator-identity"><span class="avatar">${esc(p.name.slice(0,1))}</span><h3>${esc(p.name)}</h3></div><p>${esc(p.bio)||' '}</p><div class="tiny-works">${ws.slice(0,3).map(art).join('')}</div><div class="foot"><span>${ws.length} 件作品</span><span>查看名片 ↗</span></div></a>`;}
function creators(){return shell(`<div class="page-head"><h1>创作者名片</h1></div><div class="grid3 creators">${(state.profile.published?['me',...(state.authorId==='new'?['lin']:[]),'aya','man']:[...(state.authorId==='new'?['lin']:[]),'aya','man']).map(creatorTile).join('')}</div>`,'creators');}
function cardPreview(p,button=''){const ws=selectedWorks(p);return `<div class="card-preview"><div class="card-mark"><span>FUNTRACK</span><span>CREATOR</span></div><h2>${esc(p.name||'你的名字')}</h2><p>${esc(p.bio||' ')}</p><div class="thumbs">${ws.length?ws.slice(0,3).map(art).join(''):'<div class="art" style="width:100%;font-size:11px">还没有展示作品</div>'}</div><div class="bottom"><span>${ws.length} 件作品</span>${button||'<span>作品名片</span>'}</div></div>`;}
function publicCard(id,q){const p=cardData(id),isOwn=id==='me'||id===state.authorId;if(isOwn&&!p.published)return shell(`<a class="back" href="#/creators">← 创作者名片</a><div class="empty"><h2>名片尚未发布</h2><a class="button primary" href="#/studio/card">制作我的名片</a></div>`,'creators');return shell(`<div class="row between"><a class="back" href="#/creators">← 创作者名片</a>${isOwn&&state.signed?'<a class="inline-link" href="#/studio/card">重新制作</a>':''}</div>${cardArtifact(p,`/card/${id}${q.size?'?'+q.toString():''}`,q.get('open')==='1')}`,'creators');}
function totals(ws){return {views:ws.reduce((n,w)=>n+w.views,0),starts:ws.reduce((n,w)=>n+(w.starts||0),0),feedback:ws.reduce((n,w)=>n+w.feedback,0)};}
function metrics(ws,range='7'){const t=totals(ws),factor=range==='30'?3:1,ids=route().q.get('work'),query='?range='+range+(ids?'&work='+encodeURIComponent(ids):'');return `<div class="metrics"><a class="metric" href="#/studio/data${query}"><span>作品页访问</span><strong>${t.views*factor}</strong></a><a class="metric" href="#/studio/data${query}"><span>开始试玩</span><strong>${ws.length&&!ws.some(w=>w.starts!==null)?'—':t.starts*factor}</strong><small>${ws.length&&!ws.some(w=>w.starts!==null)?'尚未接入试玩事件':'已接入的 '+ws.filter(w=>w.starts!==null).length+' 件作品'}</small></a><a class="metric" href="#/studio/feedback${query}"><span>收到反馈</span><strong>${t.feedback+(range==='30'?ws.reduce((n,w)=>n+(seededWorks.find(s=>s.id===w.id)?.feedback||0)*2,0):0)}</strong></a></div>`;}
function chart(ws,range='7',metric=chartMetric){const base=metric==='views'?[22,31,43,36,48,57,49]:[6,9,13,10,17,22,17],total=totals(ws)[metric],series=base.map(n=>Math.round(n/base.reduce((a,b)=>a+b,0)*total*(range==='30'?3:1)));if(!total)return `<div class="chart-empty">${metric==='starts'&&ws.length&&!ws.some(w=>w.starts!==null)?'尚未接入试玩事件':'暂无数据'}</div>`;const max=Math.max(...series)*1.2;const points=series.map((n,i)=>`${i*100},${145-n/max*130}`).join(' ');return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 600 160" preserveAspectRatio="none" role="img" aria-label="${metric==='views'?'访问':'试玩'}趋势，示意数据"><path d="M0 15H600 M0 80H600 M0 145H600" stroke="#e7ebdf" fill="none" stroke-dasharray="3 5"/><polygon points="0,145 ${points} 600,145" fill="#f1f4eb"/><polyline points="${points}" stroke="#7c8e65" fill="none" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="chart-labels">${(range==='30'?['10.18','10.23','10.28','11.02','11.07','11.12','11.16']:['11.10','11.11','11.12','11.13','11.14','11.15','11.16']).map(d=>`<span>${d}</span>`).join('')}</div></div>`;}
function loginGate(){return shell('<div class="empty"><h1>创作者中心</h1><button class="primary" data-action="enter-studio">登录并进入</button></div>','studio');}
function overview(){if(!state.signed)return loginGate();return shell(`<div class="page-head"><h1>概览</h1><a href="#/publish" class="button primary">＋ 发布作品</a></div><div class="row between" style="margin-bottom:12px"><h2 class="small">作品表现</h2><span class="muted small">最近 7 天</span></div>${metrics(state.works)}<div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><h2>作品页访问</h2><a href="#/studio/data">查看数据 ↗</a></div>${chart(state.works,'7','views')}</section><section class="panel"><div class="panel-head"><h2>最近反馈</h2><a href="#/studio/feedback">全部反馈 ↗</a></div>${state.feedback.length?state.feedback.slice(0,2).map(f=>`<a href="#/studio/feedback?item=${f.id}" class="feedback-item">${esc(f.text)}<small>${esc(lookup(f.work)?.name)} · ${f.version} · ${esc(f.author)}</small></a>`).join(''):'<p class="small muted">发布作品后，收到的反馈会出现在这里。</p>'}</section></div><aside class="stack"><section><div class="panel-head"><h2>我的名片</h2><a href="#/studio/card">制作 ↗</a></div>${cardPreview(state.profile,`<a href="#${state.profile.published?'/card/me':'/studio/card'}" class="inline-link">${state.profile.published?'预览名片 ↗':'制作名片 ↗'}</a>`)}<div class="row between small muted" style="margin-top:13px"><span>名片访问 · 最近 7 天</span><span>${state.cardVisits} 次</span></div></section><section class="panel"><div class="panel-head"><h2>我的作品</h2><a href="#/studio/works">管理 ↗</a></div>${state.works.length?state.works.map(w=>`<a class="feedback-item row between" href="#/studio/data?work=${w.id}"><span>${esc(w.name)}</span><span class="muted small">${w.feedback} 条反馈</span></a>`).join(''):'<p class="small muted">还没有发布作品</p>'}</section></aside></div>`,'studio',true);}
function worksPage(){if(!state.signed)return loginGate();return shell(`<div class="page-head"><h1>我的作品</h1><a class="button primary" href="#/publish">＋ 发布作品</a></div><div class="row between small muted" style="margin-bottom:24px"><span>已发布 ${state.works.length} 件</span><span>最近 7 天</span></div>${state.works.length?`<div class="grid3">${state.works.map(w=>`<article class="managed-work"><a href="#/work/${w.id}?from=%2Fstudio%2Fworks">${art(w)}<div class="row between"><h3>${esc(w.name)}</h3><span class="small muted">${w.version}</span></div></a><div class="work-metrics"><a href="#/studio/data?work=${w.id}">访问<b>${w.views}</b></a><a href="#/studio/data?work=${w.id}">试玩<b>${w.starts===null?'—':w.starts}</b></a><a href="#/studio/feedback?work=${w.id}">反馈<b>${w.feedback}</b></a></div><div class="managed-actions"><a class="inline-link" href="#/studio/data?work=${w.id}">查看数据 ↗</a><details><summary aria-label="${esc(w.name)}的更多操作">•••</summary><div class="more-menu"><a href="#/studio/feedback?work=${w.id}">查看反馈</a><button data-make-card="${w.id}">用它制作名片</button></div></details></div></article>`).join('')}</div>`:'<div class="empty"><h2>还没有作品</h2><p class="small">发布第一件作品后，可以查看表现和制作名片。</p></div>'}`,'studio',true);}
function filters(q,withRange=true){return `<div class="range"><select aria-label="筛选作品" data-filter="work"><option value="all">全部作品</option>${state.works.map(w=>`<option value="${w.id}" ${q.get('work')===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select>${withRange?`<select aria-label="时间范围" data-filter="range"><option value="7" ${q.get('range')!=='30'?'selected':''}>最近 7 天</option><option value="30" ${q.get('range')==='30'?'selected':''}>最近 30 天</option></select>`:''}</div>`;}
function dataPage(q){if(!state.signed)return loginGate();const ws=q.get('work')&&q.get('work')!=='all'?state.works.filter(w=>w.id===q.get('work')):state.works,range=q.get('range')||'7',factor=range==='30'?3:1,t=totals(ws),sources=[Math.round(t.views*148/286),Math.round(t.views*86/286)];sources.push(t.views-sources[0]-sources[1]);return shell(`<div class="page-head"><h1>数据</h1>${filters(q)}</div>${metrics(ws,range)}<div class="two-col"><section class="panel"><div class="panel-head"><h2>${chartMetric==='views'?'作品页访问':'开始试玩'}</h2><div class="segmented"><button data-chart="views" class="${chartMetric==='views'?'active':''}">访问</button><button data-chart="starts" class="${chartMetric==='starts'?'active':''}">试玩</button></div></div>${chart(ws,range)}</section><section class="panel"><div class="panel-head"><h2>作品访问来源</h2></div>${['发现作品','创作者名片','外部分享'].map((n,i)=>`<div class="source-row"><span>${n}</span><div class="bar"><i style="width:${t.views?sources[i]/t.views*100:0}%"></i></div><span>${sources[i]*factor}</span></div>`).join('')}</section></div><section style="margin-top:30px"><div class="panel-head"><h2>各作品表现</h2></div><div class="table-scroll"><table class="data-table"><thead><tr><th>作品</th><th style="text-align:right">作品页访问</th><th style="text-align:right">开始试玩</th><th style="text-align:right">反馈</th></tr></thead><tbody>${ws.map(w=>`<tr><td><a href="#/studio/data?work=${w.id}&range=${range}">${esc(w.name)}</a><small>${w.mode}${w.starts===null?` · 外链点击 ${w.clicks||0} 次（7 天）`:''}</small></td><td class="num">${w.views*factor}</td><td class="num">${w.starts===null?'—':w.starts*factor}</td><td class="num"><a href="#/studio/feedback?work=${w.id}">${w.feedback+(range==='30'?(seededWorks.find(s=>s.id===w.id)?.feedback||0)*2:0)} ↗</a></td></tr>`).join('')}</tbody></table></div><p class="small muted" style="font-size:10px;margin-top:17px">按次数统计。— 表示尚未接入试玩事件；收到反馈不等于完成试玩。</p></section>`,'studio',true);}
function feedbackPage(q){if(!state.signed)return loginGate();const fs=state.feedback.filter(f=>!q.get('work')||q.get('work')==='all'||f.work===q.get('work'));const f=fs.find(f=>f.id===(q.get('item')||selectedFeedback))||fs[0];return shell(`<div class="page-head"><h1>反馈</h1>${filters(q,false)}</div>${f?`<div class="inbox"><div class="inbox-list">${fs.map(x=>`<button data-feedback="${x.id}" class="${x.id===f.id?'active':''}">${esc(x.text.slice(0,28))}${x.text.length>28?'…':''}<small>${esc(lookup(x.work)?.name)} · ${x.done?'已处理':esc(x.type)}</small></button>`).join('')}</div><article class="inbox-body"><div class="row between"><h2>${esc(lookup(f.work)?.name)}</h2><span class="small muted">${f.version}</span></div><blockquote>${esc(f.text)}</blockquote><div class="small muted">${esc(f.author)} · ${esc(f.time)}</div><hr><div class="row between"><a class="inline-link" href="#/work/${f.work}?from=${encodeURIComponent('/studio/feedback'+(q.size?'?'+q.toString():''))}">查看作品 ↗</a><button class="primary" data-done="${f.id}" ${f.done?'disabled':''}>${f.done?'已处理':'标记已处理'}</button></div></article></div><p class="small muted" style="margin-top:15px;font-size:10px">此处展示 ${fs.length} 条示例内容，数据面板的反馈总量包含未展开的样例记录。</p>`:'<div class="empty"><h2>暂时没有反馈</h2><a class="button" href="#/studio/works">查看我的作品</a></div>'}`,'studio',true);}
function cardEditor(){if(!state.signed)return loginGate();const chosen=cardDraft.selected.filter(id=>state.works.some(w=>w.id===id));cardDraft.selected=chosen;return shell(`${builderHeading()}${stepper(1)}${!state.works.length?`<div class="empty"><h2>先发布一件作品</h2><a class="button primary" href="#/publish?from=card">发布作品</a></div>`:`<div class="builder-grid"><section><div class="panel-head"><h2>选择作品</h2><span class="small muted" id="selection-count">已选 ${chosen.length} 件</span></div><div class="selection-grid">${state.works.map(w=>`<label class="work-option"><input type="checkbox" name="card-work" value="${w.id}" ${chosen.includes(w.id)?'checked':''} aria-label="选择 ${esc(w.name)}">${art(w)}<h3>${esc(w.name)}</h3><small>${w.version} · 已发布</small></label>`).join('')}</div></section><aside class="selection-summary"><h3>展示顺序</h3><div id="selection-list">${selectionList()}</div></aside></div><div class="builder-bottom"><a class="inline-link" href="#/studio">返回概览</a><button class="primary" id="to-template" data-action="to-template" ${!chosen.length?'disabled':''}>下一步：选模板 →</button></div>`}`,'studio',true);}
function cardReview(){if(!state.signed)return loginGate();const valid=generatedCard&&generationReceipt?.key===draftKey();return shell(`${builderHeading()}${stepper(3)}${valid?`<div class="page-head"><div><h2>名片已生成</h2><p class="small muted" style="margin-top:8px">${templateInfo(generatedCard.template).name} · ${generatedCard.selected.length} 件作品</p></div><button class="primary" data-action="publish-card">发布名片</button></div>${cardArtifact(generatedCard,'/studio/card/preview')}<div class="builder-bottom"><a class="inline-link" href="#/studio/card/templates">← 更换模板</a><a class="inline-link" href="#/studio/card">调整作品</a></div>`:`<div class="empty"><h2>这一版还没有生成</h2><a class="button primary" href="#/studio/card/templates">选择模板并生成</a></div>`}`,'studio',true);}
function publishPage(){const fromCard=route().q.get('from')==='card';return shell(`<div class="narrow"><a href="#${fromCard?'/studio/card':'/studio/works'}" class="back">← ${fromCard?'返回选作品':'我的作品'}</a><div class="page-head"><h1>发布作品</h1></div><form id="publish-form"><label class="field">作品名称<input name="name" required maxlength="50" value="${esc(publishDraft.name)}"></label><label class="field">试玩链接<input name="url" type="url" required placeholder="https://" value="${esc(publishDraft.url)}"></label><label class="field">作品介绍<textarea name="desc" maxlength="150" required>${esc(publishDraft.desc)}</textarea></label><details class="small muted"><summary style="cursor:pointer">封面与数据接入</summary><div class="panel" style="margin-top:15px"><div class="art" style="height:100px;font-size:12px">封面位置</div><p style="margin-top:15px;font-size:12px">本轮按外部链接发布：记录作品页访问、外链点击和站内反馈。游戏内事件需要额外接入。</p></div></details><p class="form-error" id="publish-error" role="alert"></p><div class="form-actions"><a class="inline-link" href="#${fromCard?'/studio/card':'/studio/works'}">返回</a><button class="primary" type="submit">发布作品</button></div></form></div>`,'studio',state.signed);}
function published(id){const w=lookup(id);return shell(`<div class="empty"><div class="success-mark">✓</div><h1>作品已发布</h1><p>${esc(w?.name||'你的作品')}</p><a href="#/studio/card" class="button primary">加入我的名片 →</a><a href="#/studio/works" class="inline-link">返回我的作品</a></div>`,'studio',true);}
function workPage(id,q){const w=lookup(id);if(!w)return shell('<h1>作品不存在</h1><a href="#/discover" class="back">返回发现作品</a>','discover');const from=q.get('from')||'/discover',safeFrom=from.startsWith('/')&&!from.startsWith('//')?from:'/discover',started=played[id]??(q.get('feedback')==='1'),draft=feedbackDraft[id]||{text:'',type:'建议',sent:false};return shell(`<a class="back" href="#${esc(safeFrom)}">← 返回${safeFrom.startsWith('/card')?'名片':safeFrom.includes('/studio')?'创作者中心':'发现作品'}</a><div class="page-head"><div><h1>${esc(w.name)}</h1><div class="detail-meta"><a href="#/card/${w.authorId===state.authorId?'me':w.authorId}">${esc(cardData(w.authorId).name)} ↗</a>　·　${w.version}</div></div></div><div class="two-col"><section><div class="stage"><div class="shape"></div><span>${started?'试玩结束 · 交互占位':'游戏画面占位'}</span>${!started?`<button class="primary" data-play="${id}">${w.mode==='外部链接'?'打开试玩（演示）':'开始试玩'}</button>`:`<button data-replay="${id}">再试一次</button>`}</div><p class="small muted">${esc(w.desc)}</p></section><aside>${started?draft.sent?`<div class="panel"><h2>反馈已提交</h2><p class="small muted" style="margin-top:14px">创作者可以在反馈页看到这条内容。</p><a class="button primary" style="margin-top:22px" href="#${esc(safeFrom)}">返回${safeFrom.startsWith('/card')?'名片':'浏览'}</a></div>`:`<form id="feedback-form" class="feedback-form panel" data-work="${id}"><h2>留下反馈</h2><div class="choices">${['喜欢','建议','问题'].map(t=>`<label><input name="type" type="radio" value="${t}" ${draft.type===t?'checked':''}>${t}</label>`).join('')}</div><label class="field">你的感受<textarea name="text" required maxlength="500">${esc(draft.text)}</textarea></label><button class="primary" type="submit" style="width:100%">提交反馈</button></form>`:`<div class="panel"><h2>试玩之后</h2><p class="small muted" style="margin-top:14px">给创作者留下一条反馈。</p></div>`}</aside></div>`,'discover');}
function render(){const {path,q}=route();$('#overview-link').classList.toggle('active',path==='/map');$('#page-select').value=pages.some(([v])=>v===path)?path:path.startsWith('/work/')?'/discover':path.startsWith('/card/')?'/card/me':path.includes('/studio/card')?'/studio/card':'/publish';$('#scenario').value=state.scenario;let html;if(path==='/map')html=mapPage();else if(path==='/discover')html=discover();else if(path==='/creators')html=creators();else if(path.startsWith('/card/'))html=publicCard(path.split('/')[2],q);else if(path==='/studio')html=overview();else if(path==='/studio/works')html=worksPage();else if(path==='/studio/data')html=dataPage(q);else if(path==='/studio/feedback')html=feedbackPage(q);else if(path==='/studio/card')html=cardEditor();else if(path==='/studio/card/templates')html=templatePage();else if(path==='/studio/card/preview')html=cardReview();else if(path==='/costs')html=costPage();else if(path==='/publish')html=publishPage();else if(path.startsWith('/published/'))html=published(path.split('/')[2]);else if(path.startsWith('/work/'))html=workPage(path.split('/')[2],q);else html=mapPage();$('#app').innerHTML=html;document.title=`${pages.find(([v])=>v===path)?.[1]||'页面预览'} · Funtrack 线框稿`;}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='login'){requireLogin('继续查看与管理自己的作品。',()=>render());}if(b.dataset.action==='enter-studio'){requireLogin('登录后进入你的作品、数据、反馈与名片。',()=>render());}if(b.dataset.play){played[b.dataset.play]=true;render();}if(b.dataset.replay){played[b.dataset.replay]=false;render();}if(b.dataset.chart){chartMetric=b.dataset.chart;render();}if(b.dataset.feedback){selectedFeedback=b.dataset.feedback;const r=route();r.q.set('item',selectedFeedback);go(r.path+'?'+r.q.toString());}if(b.dataset.done){const f=state.feedback.find(f=>f.id===b.dataset.done);if(f)f.done=true;render();notify('已标记处理');}if(b.dataset.action==='publish-card'){if(!generatedCard||generationReceipt?.key!==draftKey()){go('/studio/card/templates');return;}state.profile={...structuredClone(generatedCard),published:true};go('/card/me');notify('名片已发布（演示）');}});
document.addEventListener('change',e=>{if(e.target.dataset.filter){const r=route();r.q.set(e.target.dataset.filter,e.target.value);r.q.delete('item');go(r.path+'?'+r.q.toString());}if(e.target.closest('#card-form')&&e.target.name==='selected'){cardDraft.selected=[...document.querySelectorAll('#card-form input[name="selected"]:checked')].map(x=>x.value);$('#draft-preview').innerHTML=cardPreview(cardDraft);}});
document.addEventListener('input',e=>{const form=e.target.closest('form');if(!form)return;const key=e.target.name;if(form.id==='publish-form'){publishDraft[key]=e.target.value;}if(form.id==='card-form'&&key!=='selected'){cardDraft[key]=e.target.value;$('#draft-preview').innerHTML=cardPreview(cardDraft);}if(form.id==='feedback-form'){const id=form.dataset.work;feedbackDraft[id]={...(feedbackDraft[id]||{text:'',type:'建议',sent:false}),[key]:e.target.value};}});
document.addEventListener('submit',e=>{const form=e.target;if(!['publish-form','card-form','feedback-form'].includes(form.id))return;e.preventDefault();if(form.id==='card-form'){if(!cardDraft.name.trim()){form.elements.name.setCustomValidity('请输入名字');form.elements.name.reportValidity();form.elements.name.setCustomValidity('');return;}go('/studio/card/preview');}if(form.id==='publish-form'){const data=new FormData(form);publishDraft={name:data.get('name').trim(),url:data.get('url').trim(),desc:data.get('desc').trim()};let url;try{url=new URL(publishDraft.url);}catch{}if(!url||!['http:','https:'].includes(url.protocol)||!publishDraft.name||!publishDraft.desc){$('#publish-error').textContent='请填写名称、介绍，以及 http 或 https 试玩链接。';return;}const snapshot={...publishDraft};requireLogin('登录后发布这件作品，填写的内容会保留。',()=>{const id='work-'+Date.now();state.works.push({id,authorId:state.authorId,name:snapshot.name,url:snapshot.url,desc:snapshot.desc,kind:'garden',mode:'外部链接',version:'v0.1',views:0,starts:null,feedback:0,clicks:0});cardDraft.selected.push(id);publishDraft={name:'',url:'',desc:''};go('/published/'+id);});}if(form.id==='feedback-form'){const id=form.dataset.work,data=new FormData(form),text=data.get('text').trim();if(!text){form.elements.text.setCustomValidity('请写下一点感受');form.elements.text.reportValidity();form.elements.text.setCustomValidity('');return;}feedbackDraft[id]={text,type:data.get('type'),sent:false};requireLogin('登录后提交这条反馈，内容会保留。',()=>{if(feedbackDraft[id]?.sent)return;const w=lookup(id);const entry={id:'f'+Date.now(),work:id,version:w.version,text,type:data.get('type'),author:state.profile.name,time:'刚刚',done:false};const own=state.works.find(x=>x.id===id);if(own){state.feedback.unshift(entry);own.feedback++;}else state.sentFeedback.push(entry);feedbackDraft[id].sent=true;render();});}});
const routeScroll=new Map();let visibleRoute=location.hash;window.addEventListener('scroll',()=>routeScroll.set(visibleRoute,window.scrollY),{passive:true});window.addEventListener('hashchange',()=>{cancelLogin();visibleRoute=location.hash;render();requestAnimationFrame(()=>window.scrollTo(0,visibleRoute.startsWith('#/discover')||visibleRoute.startsWith('#/studio/works')?(routeScroll.get(visibleRoute)||0):0));});

const templates=[{id:'wall',name:'白墙画展',description:'作品平铺，一眼看全。'},{id:'fold',name:'卡中展厅',description:'展开名片，进入作品展厅。'},{id:'corridor',name:'一镜展廊',description:'首件作品为主，其余沿廊展开。'},{id:'planet',name:'作品星球',description:'作品环绕；超过 6 件时平铺。'}];
let generatedCard=null,generationReceipt=null;
const generationCache=new Map(),artifactViews=new Map();
function templateInfo(id){return templates.find(t=>t.id===id)||templates[0];}
function builderHeading(){return `<div class="page-head"><h1>我的名片</h1>${state.profile.published?'<a class="inline-link" href="#/card/me">查看已发布名片 ↗</a>':''}</div>`;}
function stepper(step){return `<nav class="flow-steps" aria-label="名片生成步骤">${[[1,'选作品','/studio/card'],[2,'选模板','/studio/card/templates'],[3,'生成','/studio/card/preview']].map(([n,t,url])=>`${n>1?'<em>—</em>':''}${n<step?`<a href="#${url}"><i>${n}</i>${t}</a>`:`<span class="${n===step?'current':''}" ${n===step?'aria-current="step"':''}><i>${n}</i>${t}</span>`}`).join('')}</nav>`;}
function selectionList(){return cardDraft.selected.length?cardDraft.selected.map((id,i)=>`<div class="selected-row"><span>${i+1}. ${esc(lookup(id)?.name)}</span><div class="order-buttons"><button data-order="${id}" data-direction="-1" aria-label="上移 ${esc(lookup(id)?.name)}" ${i===0?'disabled':''}>↑</button><button data-order="${id}" data-direction="1" aria-label="下移 ${esc(lookup(id)?.name)}" ${i===cardDraft.selected.length-1?'disabled':''}>↓</button></div></div>`).join(''):'<p class="small muted">尚未选择作品</p>';}
function templateThumb(id){const ws=cardDraft.selected.slice(0,3).map(lookup).filter(Boolean);return `<div class="template-thumb ${id}" aria-hidden="true">${ws.map(art).join('')}</div>`;}
function templatePage(){if(!state.signed)return loginGate();if(!cardDraft.selected.length)return shell(`${builderHeading()}${stepper(2)}<div class="empty"><h2>先选择至少一件作品</h2><a class="button primary" href="#/studio/card">选择作品</a></div>`,'studio',true);return shell(`${builderHeading()}${stepper(2)}<div class="builder-grid"><section><div class="panel-head"><h2>选择模板</h2></div><div class="template-grid">${templates.map(t=>`<label class="template-choice"><input type="radio" name="card-template" value="${t.id}" ${templateInfo(cardDraft.template).id===t.id?'checked':''} aria-label="${t.name}">${templateThumb(t.id)}<div class="template-name"><h3>${t.name}</h3></div><p>${t.description}</p></label>`).join('')}</div></section><aside class="selection-summary"><h3>这张名片</h3><div class="material-list"><b>${esc(state.profile.name)}</b><p>${esc(state.profile.bio)}</p><hr><b>${cardDraft.selected.length} 件作品</b>${cardDraft.selected.map(id=>`<p>${esc(lookup(id)?.name)}</p>`).join('')}</div></aside></div><div class="builder-bottom"><a class="inline-link" href="#/studio/card">← 返回选作品</a><button class="primary" data-action="generate-card">生成名片</button></div><p class="form-error" id="generation-error" role="alert"></p>`,'studio',true);}
function cardArtifact(p,from,open=false){const ws=selectedWorks(p),t=templateInfo(p.template),view=artifactViews.get(from)||{},tile=w=>workTile(w,from),head=`<div class="artifact-header"><span class="avatar">${esc(p.name.slice(0,1))}</span><div><h2>${esc(p.name)}</h2><p>${esc(p.bio)}</p></div></div>`;let body='';if(t.id==='fold'){body=`<div class="fold-door" aria-hidden="true">${ws.slice(0,3).map(art).join('')}</div><details class="fold-exhibit" data-artifact="${esc(from)}" data-view="fold" ${(view.fold??open)?'open':''}><summary>展开 / 收起作品展厅 · ${ws.length} 件作品</summary><div class="artifact-body"><div class="grid3">${ws.map(tile).join('')}</div></div></details>`;}else if(t.id==='corridor'){body=`<div class="artifact-body"><div class="corridor-grid">${ws.map(tile).join('')}</div></div>`;}else if(t.id==='planet'&&ws.length<=6){body=`<div class="artifact-body planet-body"><div class="constellation">${ws.map((w,i)=>{const a=(i/ws.length*Math.PI*2)-Math.PI/2,x=ws.length===1?50:50+30*Math.cos(a),y=ws.length===1?50:50+30*Math.sin(a);return `<div style="--x:${x}%;--y:${y}%">${tile(w)}</div>`;}).join('')}</div><details class="flat-toggle" data-artifact="${esc(from)}" data-view="flat" ${view.flat?'open':''}><summary>切换平铺浏览</summary><div class="grid3">${ws.map(tile).join('')}</div></details></div>`;}else body=`<div class="artifact-body">${t.id==='planet'?'<p class="small muted" style="margin-bottom:20px">作品超过 6 件，使用平铺视图。</p>':''}<div class="grid3">${ws.map(tile).join('')}</div></div>`;return `<section class="artifact artifact-${t.id}" aria-label="${t.name}名片">${head}${ws.length?body:'<div class="artifact-empty">还没有展示作品</div>'}</section>`;}
function draftKey(){return JSON.stringify({name:state.profile.name,bio:state.profile.bio,template:templateInfo(cardDraft.template).id,works:cardDraft.selected.map(lookup).filter(Boolean).map(w=>({id:w.id,name:w.name,desc:w.desc,kind:w.kind,version:w.version,authorId:w.authorId,url:w.url||''}))});}
function generateCard(){if(!cardDraft.selected.length){go('/studio/card');return;}try{const start=performance.now(),key=draftKey(),cached=generationCache.get(key);generatedCard=cached?structuredClone(cached):{name:state.profile.name,bio:state.profile.bio,selected:[...cardDraft.selected],template:templateInfo(cardDraft.template).id,works:cardDraft.selected.map(id=>structuredClone(lookup(id))),published:false};if(!cached)generationCache.set(key,structuredClone(generatedCard));generationReceipt={key,template:generatedCard.template,works:generatedCard.selected.length,modelCalls:0,modelUSD:0,assemblyMs:Math.max(0,performance.now()-start),bytes:new TextEncoder().encode(JSON.stringify(generatedCard)).length,cached:!!cached};go('/studio/card/preview');}catch{const el=$('#generation-error');if(el)el.textContent='生成失败，所选作品与模板已保留，请重试。';}}
document.addEventListener('change',e=>{if(e.target.name==='card-work'){const id=e.target.value;if(e.target.checked){if(!cardDraft.selected.includes(id))cardDraft.selected.push(id);}else cardDraft.selected=cardDraft.selected.filter(x=>x!==id);$('#selection-list').innerHTML=selectionList();$('#selection-count').textContent='已选 '+cardDraft.selected.length+' 件';$('#to-template').disabled=!cardDraft.selected.length;}if(e.target.name==='card-template')cardDraft.template=e.target.value;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='to-template'&&cardDraft.selected.length)go('/studio/card/templates');if(b.dataset.action==='generate-card')generateCard();if(b.dataset.makeCard){cardDraft.selected=[b.dataset.makeCard];go('/studio/card');}if(b.dataset.order){const i=cardDraft.selected.indexOf(b.dataset.order),j=i+Number(b.dataset.direction);if(i>=0&&j>=0&&j<cardDraft.selected.length){[cardDraft.selected[i],cardDraft.selected[j]]=[cardDraft.selected[j],cardDraft.selected[i]];$('#selection-list').innerHTML=selectionList();}}});
document.addEventListener('submit',e=>{if(e.target.id==='work-search'){e.preventDefault();const q=new FormData(e.target).get('q').trim();go('/discover?q='+encodeURIComponent(q)+'&kind='+(route().q.get('kind')||'all'));}});


const costAssumptions={ai:0,n:1000,input:2000,output:500,retry:10,reuse:0,retained:1000,kb:50,visits:100000,reads:4,cdn:0,freeGB:10,freeA:1000000,freeB:10000000,worker:0};
function costNumber(name,label,step=1,max=1000000000){return `<label class="field">${label}<input data-cost="${name}" type="number" min="0" max="${max}" step="${step}" value="${costAssumptions[name]}"></label>`;}
function costEstimate(c){const longContext=c.input>272000,perCall=(c.input*.1*(longContext?2:1)+c.output*.5*(longContext?1.5:1))/1e6,calls=c.n*c.ai*(1-c.reuse/100)*(1+c.retry/100),model=calls*perCall,storage=c.retained*c.kb/1e6,writes=c.n,reads=c.visits*c.reads*(1-c.cdn/100),r2=Math.ceil(Math.max(0,storage-c.freeGB))*.015+Math.ceil(Math.max(0,writes-c.freeA)/1e6)*4.5+Math.ceil(Math.max(0,reads-c.freeB)/1e6)*.36,workerRequests=c.n*2,workerCPU=workerRequests*5,workerExtra=c.worker?Math.max(0,workerRequests-1e7)/1e6*.3+Math.max(0,workerCPU-3e7)/1e6*.02:0,invalidModel=!!c.ai&&(c.input+c.output>1050000||c.output>128000),invalidFree=!c.worker&&workerRequests>3000000,total=invalidModel||invalidFree?null:model+r2+c.worker+workerExtra;return {invalidModel,invalidFree,longContext,perCall,calls,model,storage,writes,reads,r2,workerRequests,workerExtra,total,perVersion:c.n&&total!==null?total/c.n:null};}
function costResult(){const c=costAssumptions,v=costEstimate(c),usd=n=>'$'+n.toFixed(6);return `<h2>名片模块 / 月</h2><div class="cost-total">${v.total===null?'请调整假设':'$'+v.total.toFixed(3)}</div>${v.invalidFree?'<p class="form-error">超过 Free 在 30 天内的最大请求容量，请选择 Paid。</p>':''}${v.invalidModel?'<p class="form-error">超过模型上下文或输出容量，请减少 tokens。</p>':''}<p>基于下列假设的估算，非实际云账单</p><div class="cost-breakdown"><div><span>AI 文案</span><b>${usd(v.model)}</b></div><div><span>R2 保存与访问</span><b>${usd(v.r2)}</b></div><div><span>Workers 共享基础费</span><b>$${c.worker.toFixed(2)}</b></div><div><span>Workers 超额</span><b>${usd(v.workerExtra)}</b></div><div><span>摊到每次保存</span><b>${v.perVersion!==null?usd(v.perVersion):'—'}</b></div></div><p style="margin-top:20px">${v.storage.toFixed(3)} GB-month · ${v.writes.toLocaleString()} 次写入 · ${Math.round(v.reads).toLocaleString()} 次读取</p><p style="margin-top:10px">${c.ai?`${v.calls.toFixed(1)} 次模型调用预算；单次基础 ${usd(v.perCall)}，不依赖 prompt cache 折扣。${v.longContext?'已应用长上下文倍率：输入 ×2、输出 ×1.5。':''}`:'当前为纯模板合成：AI 调用 0 次。'}访问名片不会重新生成内容。</p>${!c.worker?'<p style="margin-top:10px">Workers 按免费计划估算，仍需满足每日请求和每次 CPU 限额；月合计不能证明每日均不超限。</p>':''}<hr><p>不含原有游戏托管、账号系统、数据采集、支付手续费、人工与税费。R2 免费额度账户共享；计费单位向上取整。新图像、视频、服务端截图导出未启用。</p>`;}
function generationReceiptHTML(){if(!generationReceipt)return '<div class="receipt">先走一遍「我的名片 → 选作品 → 选模板 → 生成」，这里会显示本次浏览器生成记录。</div>';const r=generationReceipt;return `<div class="receipt"><b>本次原型生成记录</b><br>${templateInfo(r.template).name} · ${r.works} 件作品 · ${r.cached?'复用已有生成结果':'新合成'}<br>模型调用 0 次 / 模型费用 $0 · 配置 ${r.bytes.toLocaleString()} bytes<br>本机资料组装 ${r.assemblyMs.toFixed(2)} ms（不含页面绘制，不代表服务端耗时）</div>`;}
function costPage(){const c=costAssumptions;return `<section class="cost-panel"><a class="back" href="#/studio/card">← 返回名片制作</a><h1>名片模块成本试算</h1><p class="cost-intro">内部定价参考 · USD · 单价核验于 2026-11-16。纯模板是默认方案；下面的 AI 与云资源只是可调场景，不会发起付费请求。</p>${generationReceiptHTML()}<div class="cost-layout"><form id="cost-form" class="cost-form"><label class="field">生成方式<select data-cost="ai"><option value="0" ${!c.ai?'selected':''}>已有资料 + 模板（不使用 AI）</option><option value="1" ${c.ai?'selected':''}>模板 + AI 文案整理（假设场景）</option></select></label><div class="cost-input-row">${costNumber('n','月保存版本数')}${costNumber('visits','月名片访问次数')}</div><label class="field">Workers 计划<select data-cost="worker"><option value="0" ${!c.worker?'selected':''}>Free · 须满足每日限额</option><option value="5" ${c.worker?'selected':''}>Paid · 共享基础费 $5/月</option></select></label><details ${c.ai?'open':''}><summary style="cursor:pointer;font-size:12px;margin:16px 0">AI 用量假设</summary><p class="small muted" style="margin-bottom:18px;font-size:11px">GPT-6 Luna / Standard，推理关闭。输入 $0.10、输出 $0.50 / 百万 tokens。仅整理已有文字，不分析游戏代码。输入超过 272K tokens 时，输入单价 ×2、输出单价 ×1.5；模型容量另行校验。</p><div class="cost-input-row">${costNumber('input','输入 tokens / 次',1,1050000)}${costNumber('output','总计费输出 tokens / 次',1,128000)}${costNumber('retry','额外调用预算 %',1,100)}${costNumber('reuse','完整结果复用率 %',1,100)}</div></details><details><summary style="cursor:pointer;font-size:12px;margin:16px 0">保存、访问与剩余免费额度</summary><div class="cost-input-row">${costNumber('retained','月平均保留版本数')}${costNumber('kb','每版本新增 KB',1)}${costNumber('reads','每次访问对象读取数')}${costNumber('cdn','CDN 命中率 %',1,100)}${costNumber('freeGB','剩余免费 GB-month',.1)}${costNumber('freeA','剩余免费写次数')}${costNumber('freeB','剩余免费读次数')}</div><p class="small muted" style="font-size:11px">只保存配置和素材引用，不复制已上传封面。每保存一次假设 1 次对象写入、2 次动态请求、每次 5 ms CPU；新增数据量和流量均待实测。</p></details></form><div class="cost-result" id="cost-result">${costResult()}</div></div><details class="cost-sources"><summary>公式与价格来源</summary><p>模型月费 = 保存次数 × AI 开关 × (1 − 完整结果复用率) × (1 + 额外调用比例) × (输入 tokens × 0.10 + 总计费输出 tokens × 0.50) ÷ 1,000,000。输入超 272K tokens 时按长上下文倍率计价。</p><p>R2 标准存储 $0.015 / GB-month，写 $4.50 / 百万次，读 $0.36 / 百万次。先扣剩余免费额度，再按计费单位向上取整。Worker Paid 基础费含 1,000 万请求与 3,000 万 CPU ms；超额按 $0.30 / 百万请求与 $0.02 / 百万 CPU ms。</p><a href="https://developers.openai.com/api/docs/models/gpt-6-luna" target="_blank" rel="noopener">OpenAI 模型与单价</a><a href="https://developers.cloudflare.com/r2/pricing/" target="_blank" rel="noopener">R2 计费</a><a href="https://developers.cloudflare.com/workers/platform/pricing/" target="_blank" rel="noopener">Workers 计费</a></details></section>`;}
document.addEventListener('input',e=>{const key=e.target.dataset.cost;if(!key)return;let v=Number(e.target.value);if(!Number.isFinite(v)||v<0)v=0;if(['retry','reuse','cdn'].includes(key))v=Math.min(100,v);costAssumptions[key]=v;$('#cost-result').innerHTML=costResult();});
document.addEventListener('change',e=>{if(e.target.dataset.cost&&e.target.tagName==='SELECT'){costAssumptions[e.target.dataset.cost]=Number(e.target.value);$('#cost-result').innerHTML=costResult();}});
document.addEventListener('submit',e=>{if(e.target.id==='cost-form')e.preventDefault();});

document.addEventListener('toggle',e=>{const el=e.target;if(el.dataset.artifact){const key=el.dataset.artifact;artifactViews.set(key,{...(artifactViews.get(key)||{}),[el.dataset.view]:el.open});}},true);
reset('creator');render();
</script>
</body>
</html>
