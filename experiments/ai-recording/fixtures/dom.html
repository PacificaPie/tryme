<!doctype html><html lang="zh"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯光路线 · DOM 评测样例</title>
<style>body{margin:0;background:#f2f1ed;color:#272620;font:20px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(84vw,620px)}small{font-size:12px;letter-spacing:2px}h1{font-size:38px}button{padding:16px 24px;border:0;border-radius:16px;background:#183f35;color:#fff;font:inherit;margin:8px 6px 8px 0}#room[hidden]{display:none}.tiles{display:flex;gap:10px;margin:24px 0}.tile{width:28%;height:100px;border-radius:20px;background:#dad8ce}.lit{background:#e8b859!important;box-shadow:0 0 40px #e8b85950}#status{min-height:40px}</style>
<main><small>TRYME / LOCAL EVALUATION FIXTURE</small><h1>灯光路线</h1><p>按顺序点亮两扇窗，看看房间的变化。</p><button type="button" id="start">开始游戏</button><section id="room" hidden><div class="tiles"><div class="tile" id="one"></div><div class="tile" id="two"></div><div class="tile" id="three"></div></div><button type="button" id="left">点亮左窗</button><button type="button" id="right">点亮右窗</button><p id="status">已点亮 0 / 2</p></section></main>
<script>let n=0;start.onclick=()=>{start.hidden=true;room.hidden=false};left.onclick=()=>{if(n===0){one.classList.add('lit');n=1;statusText()}};right.onclick=()=>{if(n===1){two.classList.add('lit');three.classList.add('lit');n=2;statusText()}};function statusText(){document.getElementById('status').textContent='已点亮 '+n+' / 2'}</script></html>
