<!doctype html><html lang="zh"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收集光点 · Canvas 评测样例</title>
<style>body{margin:0;background:#f2f1ed;color:#272620;font:18px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(88vw,620px)}h1{font-size:32px}small{font-size:12px;letter-spacing:2px}canvas{display:block;width:100%;height:auto;border-radius:24px;touch-action:none;outline:none}button{padding:12px 22px;border:0;border-radius:12px;background:#183f35;color:#fff;font:inherit;margin:10px 0}</style>
<main><small>TRYME / LOCAL EVALUATION FIXTURE</small><h1>收集光点</h1><p>开始后，点击画布右侧的两个金色光点。</p><button type="button" id="start">开始游戏</button><canvas id="board" width="600" height="280" tabindex="0" aria-label="光点游戏画布"></canvas><p id="score">收集 0 / 2</p></main>
<script>let running=false,count=0,x=90;const ctx=board.getContext('2d');function draw(){ctx.fillStyle='#183f35';ctx.fillRect(0,0,600,280);ctx.fillStyle='#f2f1ed';ctx.beginPath();ctx.arc(x,140,24,0,7);ctx.fill();if(running){ctx.fillStyle='#e8b859';for(let i=count;i<2;i++){ctx.beginPath();ctx.arc(300+i*150,140,18,0,7);ctx.fill()}}}start.onclick=()=>{running=true;start.disabled=true;draw()};board.onclick=e=>{if(!running||count>=2)return;const r=board.getBoundingClientRect(),px=(e.clientX-r.left)*600/r.width,py=(e.clientY-r.top)*280/r.height;if(Math.hypot(px-(300+count*150),py-140)<35){x=300+count*150;count++;document.getElementById('score').textContent='收集 '+count+' / 2';draw()}};board.onkeydown=e=>{if(e.key==='ArrowRight'&&running){x=Math.min(550,x+30);draw()}};draw();</script></html>
